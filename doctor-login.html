<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Login - MediCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./css/doctor-login.css">

</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary"
           href="Home.html">

            <i class="bi bi-heart-pulse-fill"></i>
            MediCare

        </a>

        <a href="Home.html"
           class="btn btn-outline-primary">

            <i class="bi bi-house"></i>
            Home

        </a>

    </div>

</nav>



<!-- ================= LOGIN SECTION ================= -->

<section class="login-section">

    <div class="container">

        <div class="login-card">


            <!-- ICON -->

            <div class="login-icon">

                <i class="bi bi-person-badge-fill"></i>

            </div>


            <h1>Doctor Login</h1>

            <p class="login-description">

                Login to manage your appointments and patients.

            </p>


            <!-- FORM -->

            <form>


                <!-- EMAIL -->

                <div class="mb-3 text-start">

                    <label class="form-label">
                        Doctor Email
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3 text-start">

                    <label class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                    </div>

                </div>


                <!-- REMEMBER -->

                <div class="d-flex justify-content-between
                            align-items-center mb-4">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="remember">

                        <label
                            class="form-check-label"
                            for="remember">

                            Remember me

                        </label>

                    </div>

                    <a href="#" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <a href="doctor-dashboard.html"
                   class="btn btn-primary login-btn">

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login to Dashboard

                </a>

            </form>


            <!-- DEMO INFORMATION -->

            <div class="demo-info">

                <i class="bi bi-info-circle-fill"></i>

                <span>
                    Demo mode: Login button opens the doctor dashboard.
                </span>

            </div>


            <!-- BACK -->

            <a href="Home.html"
               class="back-link">

                <i class="bi bi-arrow-left"></i>
                Back to MediCare

            </a>

        </div>

    </div>

</section>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="container text-center">

        <h5>

            <i class="bi bi-heart-pulse-fill"></i>
            MediCare

        </h5>

        <p>
            Doctor Appointment & Queue Management System
        </p>

        <small>
            © 2026 MediCare. All Rights Reserved.
        </small>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
